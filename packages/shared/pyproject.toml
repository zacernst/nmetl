[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "shared"
version = "0.0.1"
description = "Shared modules and utilities"
readme = "README.md"
requires-python = "==3.14.*"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "rich>=14.3.4,<15.0.0",
  # shared/otel.py and shared/telemetry.py import these directly; they
  # were previously only reachable via the workspace root.
  "opentelemetry-distro>=0.65b0,<1.0.0",
  "opentelemetry-exporter-otlp>=1.44.0,<2.0.0",
]

[[project.authors]]
name = "Zachary Ernst"
email = "zac.ernst@gmail.com"

[[project.maintainers]]
name = "Zachary Ernst"
email = "zac.ernst@gmail.com"

[project.license]
file = "LICENSE.txt"

[project.urls]
Homepage = "https://github.com/zacernst/pycypher"
