[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "pycypher-tui"
version = "0.0.1"
description = "VIM-style TUI for PyCypher ETL pipeline configuration"
readme = "README.md"
requires-python = "==3.14.*"
keywords = ["tui", "vim", "etl", "cypher", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["pycypher", "textual>=1.0.0,<2.0.0", "pyyaml>=6.0.0,<7.0.0"]

[[project.authors]]
name = "Zachary Ernst"
email = "zac.ernst@gmail.com"

[project.optional-dependencies]
# Dev tooling for this package lives in the workspace root [dependency-groups]
# (`uv sync --group dev-core`), not in an extra. The `dev` extra that used to be
# here pinned pytest-asyncio>=0.24.0, which contradicted the root's >=1.3.0.
fod = ["fastopendata"]

[[project.maintainers]]
name = "Zachary Ernst"
email = "zac.ernst@gmail.com"

[project.urls]
Homepage = "https://github.com/zacernst/pycypher"

[project.scripts]
pycypher-tui = "pycypher_tui.cli:cli_main"
