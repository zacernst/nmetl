[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pycypher = { workspace = true }
shared = { workspace = true }
pycypher-tui = { workspace = true }

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
# Security: enforce minimum patched versions for known vulnerabilities.
# These override transitive-dependency resolutions without changing the
# packages that directly depend on them.
constraint-dependencies = [
  "msgpack>=1.2.1",   # GHSA-6v7p-g79w-8964 (DoS / SEGV via repeated unpack after error)
  "starlette>=1.3.1", # CVE-2026-54282 (URL path injection), CVE-2026-54283 (form limit bypass)
  "tornado>=6.5.7",   # CVE-2026-49853/54/55 (websocket mask OOB, redirect credential leak, gzip DoS), GHSA-pw6j-qg29-8w7f
  "pip>=26.1.2",      # PYSEC-2026-196 (console_scripts path traversal)
  # Nothing in this repo imports these two; they were previously listed as
  # direct dependencies of pycypher-workspace purely to raise the floor on a
  # transitive resolution, which is what constraint-dependencies is for.
  "cryptography>=50.0.0",
  "gitpython>=3.1.59",
]


[project]
name = "pycypher-workspace"
version = "0.0.1"
description = "PyCypher monorepo workspace"
readme = "README.md"
requires-python = "==3.14.*"
keywords = ["neo4j", "cypher", "parser", "relational algebra"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  # Only 3.14 — requires-python is "==3.14.*", so advertising 3.12/3.13 here
  # promised installs that pip/uv would reject.
  "Programming Language :: Python :: 3.14",
]

dependencies = ["pycypher", "shared", "pycypher-tui"]

[[project.authors]]
name = "Zachary Ernst"
email = "zac.ernst@gmail.com"

[[project.maintainers]]
name = "Zachary Ernst"
email = "zac.ernst@gmail.com"

[project.license]
file = "LICENSE.txt"

[project.urls]
Homepage = "https://github.com/zacernst/pycypher"
Documentation = "https://zacernst.github.io/pycypher/"

[tool.pylint.main]
disable = ["line-too-long", "trailing-whitespace", "missing-docstring"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [".claude/worktrees/**"]

[tool.ty.rules]
# Temporarily ignored — mostly test-signature drift from API refactors.
# Remove these as type errors are fixed (tracked by Andy's type-fix tasks).
unknown-argument = "ignore"              # 67 hits: tests passing removed kwargs
too-many-positional-arguments = "ignore" # 34 hits: paired with above
unresolved-import = "warn"               # pyroscope etc. are optional deps

unresolved-attribute = "warn"  # 97 diagnostics, ~50% tooling gaps
invalid-argument-type = "warn" # 38 diagnostics, ~50% tooling gaps
not-subscriptable = "warn"     # 11 diagnostics, single Series|None root cause
no-matching-overload = "warn"  # 5 diagnostics, numpy/dict stub limits
invalid-assignment = "warn"    # 3 diagnostics, optional-dep fallbacks

[tool.ruff]
line-length = 79
indent-width = 4
# Matches requires-python = "==3.14.*". Note that bare "314" is invalid —
# ruff requires the py3XX form and aborts the TOML parse otherwise.
#
# This was "py312", justified in a comment as working around a ruff formatter
# "bug" that strips the parens from `except (A, B):`. That is not a bug: it is
# PEP 758, which makes unparenthesized except groups valid in 3.14, and the
# formatter only applies it when target-version says 3.14. Since every package
# here requires ==3.14.*, the rewrite is correct and the workaround was not.
#
target-version = "py314"
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
  "raw_data",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Formatter-incompatible rules (ruff docs recommend disabling when using ruff format)
  "COM812", # missing-trailing-comma — handled by formatter
  # Test-suite noise — assert is idiomatic in pytest
  "S101", # assert — 13K+ hits, all in tests
  # Docstring rules that conflict with each other
  "D203",   # incorrect-blank-line-before-class — conflicts with D211
  "D213",   # multi-line-summary-second-line — conflicts with D212
  "CPY001", # missing-copyright-notice
]

[tool.ruff.lint.per-file-ignores]
# Tests: relax docstrings, type annotations, magic values, line length, etc.
"tests/**/*.py" = [
  "ANN",     # type annotations not required in tests
  "D",       # docstrings not required in tests
  "PLR2004", # magic value comparisons are normal in tests
  "SLF001",  # accessing private members is normal in tests
  "INP001",  # implicit namespace packages (test directories)
  "PLC0415", # imports inside functions are common in tests
  "ARG002",  # unused method arguments (fixtures, parametrize)
  "E712",    # true-false comparison (pandas idx filtering in tests)
  "T201",    # print statements ok in tests
  "ERA001",  # commented-out code ok in tests
  "B905",    # zip-without-explicit-strict ok in tests
  "FBT003",  # boolean positional values ok in tests
  "PT011",   # pytest-raises-too-broad ok in tests
  "B017",    # assert-raises-exception ok in tests
  "RUF002",  # ambiguous unicode ok in test docstrings
  "RUF001",  # ambiguous unicode ok in test strings
  "E501",    # line length relaxed in tests (long assertions)
]
# Standalone scripts, demos, examples: relax annotations and docstrings
"scripts/**/*.py" = ["ANN", "D", "INP001", "T201"]
"examples/**/*.py" = ["ANN", "D", "INP001", "T201"]
"demos/**/*.py" = ["ANN", "D", "INP001", "T201", "ERA001"]
"demo_*.py" = ["ANN", "D", "INP001", "T201"]
